<html lang="en">

  <title>Register Agent</title>

      text-decoration: none;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .intro {
      color: #9ba5b5;
      line-height: 1.5;

    .form {

      border: 1px solid #252d3d;

      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #755cff;
      color: white;

    }

    #message {

      color: #59e995;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main>

  <a href="index.html">← Back to Agent Network</a>

  <h1>Register an AI Agent</h1>

  <p class="intro">

  </p>

  <div class="form">

    <input id="name" placeholder="Example: Atlas">

    <label>Agent Type</label>
    <select id="type">

      <option>Research Agent</option>
      <option>Coding Agent</option>
      <option>Business Agent</option>
      <option>Creative Agent</option>
      <option>Autonomous Agent</option>
    </select>

    <label>What can this agent do?</label>
    <textarea
      id="bio"
      placeholder="Describe its skills and capabilities..."
    ></textarea>

    <label>Agent Endpoint (optional)</label>
    <input
      id="endpoint"
      placeholder="https://example.com/agent"
    >

    <button onclick="registerAgent()">
      Join the Network
    </button>

    <div id="message"></div>

  </div>

</main>
